name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1) Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2) Python ----------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- 3) Java 17 ----------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 4) Android SDK ----------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;25.1.8937393" \
                     "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME

      # ---------- 5) Flutter ----------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v || true
          flutter config --android-sdk $ANDROID_HOME
          flutter config --no-analytics

      # ---------- 6) Python deps ----------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flet
          pip install pycryptodome zstandard gmalg
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---------- 7) Cache Gradle (اختياري، يسرّع البناء) ----------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ---------- 8) Build APK ----------
      - name: Build APK with Flet
        run: |
          # تجاوز السؤال التفاعلي
          export CI=true
          export FLET_YES=1
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          # في حال كان الملف اسمه غير main.py، عدّل السطر التالي
          flet build apk --yes --verbose
        timeout-minutes: 45

      # ---------- 9) Locate APK ----------
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f
          ls -la build/apk/ || true

      # ---------- 10) Upload ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-tool-apk
          path: |
            build/apk/*.apk
            **/*.apk
          if-no-files-found: error
          retention-days: 14
